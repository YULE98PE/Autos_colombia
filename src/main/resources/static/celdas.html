<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celdas | Autos Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Efecto de animación para el carro */
        .carro-animado {
            width: 250px;
            transition: transform 0.8s ease-in-out;
            cursor: pointer;
        }
        .carro-animado:hover {
            transform: translateX(100px); /* El carro se mueve a la derecha al pasar el mouse */
        }
        /* Estilos para las tarjetas y paneles */
        .tarjeta-premium {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .encabezado-app {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 2rem 0;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <header class="encabezado-app text-center shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="text-start">
                <h1 class="fw-bold">Autos Colombia</h1>
                <p class="mb-0 fs-5">Sistema Inteligente de Parqueadero</p>
            </div>
            <div>
                <img src="https://cdn-icons-png.flaticon.com/512/3202/3202926.png" alt="Carro animado" class="carro-animado">
            </div>
        </div>
    </header>

    <div class="container mb-5">

        <div class="card tarjeta-premium">
            <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center" style="border-top-left-radius: 15px; border-top-right-radius: 15px;">
                <span>🅿️ Gestión de celdas</span>
                <a href="/" class="btn btn-sm btn-outline-light">← Volver al panel</a>
            </div>

            <div class="card-body bg-white border-bottom">
                <div class="d-flex flex-wrap gap-4 align-items-center">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <span class="small text-muted">Tipo</span>
                        <div class="btn-group" id="filtro-tipo">
                            <button type="button" class="btn btn-primary" data-valor="">Todos</button>
                            <button type="button" class="btn btn-outline-primary" data-valor="CARRO">Carro</button>
                            <button type="button" class="btn btn-outline-primary" data-valor="MOTO">Moto</button>
                        </div>
                    </div>
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <span class="small text-muted">Estado</span>
                        <div class="btn-group" id="filtro-estado">
                            <button type="button" class="btn btn-primary" data-valor="">Todos</button>
                            <button type="button" class="btn btn-outline-primary" data-valor="DISPONIBLE">Disponible</button>
                            <button type="button" class="btn btn-outline-primary" data-valor="OCUPADA">Ocupada</button>
                            <button type="button" class="btn btn-outline-primary" data-valor="FUERA_DE_SERVICIO">Fuera de servicio</button>
                        </div>
                    </div>
                    <span class="ms-auto small text-muted" id="conteo"></span>
                </div>
            </div>

            <div id="mensaje" class="px-3 pt-3"></div>

            <div class="card-body">
                <div class="row g-3" id="grilla-celdas">
                    <div class="col-12 text-center text-muted py-3">Cargando celdas...</div>
                </div>
            </div>

            <div class="card-footer bg-white small text-muted d-flex flex-wrap gap-4">
                <span><span class="badge bg-success">Disponible</span></span>
                <span><span class="badge bg-danger">Ocupada</span></span>
                <span><span class="badge bg-secondary">Fuera de servicio</span></span>
            </div>
        </div>

    </div>

    <!-- Confirmar cambio de estado (HU-15 / HU-16) -->
    <div class="modal fade" id="modal-estado" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4" style="border-radius: 20px;">
                <h3 class="fw-bold mt-2" id="titulo-estado"></h3>
                <p class="text-muted" id="texto-estado"></p>
                <div class="d-flex justify-content-center gap-2 mt-2">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn fw-bold" id="btn-confirmar-estado"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Error "No se pudo completar" -->
    <div class="modal fade" id="modal-error" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4" style="border-radius: 20px;">
                <h3 class="fw-bold mt-2">No se pudo completar</h3>
                <p class="text-muted" id="texto-error"></p>
                <div class="d-flex justify-content-center mt-2">
                    <button type="button" class="btn btn-primary fw-bold" data-bs-dismiss="modal">Entendido</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/celdas.js"></script>
</body>
</html>
