<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autos Colombia | Parqueadero</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Efecto de animación para el carro */
        .carro-animado {
            width: 250px;
            transition: transform 0.8s ease-in-out;
            cursor: pointer;
        }
        .carro-animado:hover {
            transform: translateX(100px); /* El carro se mueve a la derecha al pasar el mouse */
        }
        /* Estilos para las tarjetas y paneles */
        .tarjeta-premium {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .encabezado-app {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 2rem 0;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <!-- Encabezado con Carro Animado -->
    <header class="encabezado-app text-center shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="text-start">
                <h1 class="fw-bold">Autos Colombia</h1>
                <p class="mb-0 fs-5">Sistema Inteligente de Parqueadero</p>
            </div>
            <!-- Imagen del carro que se mueve -->
            <div>
                <img src="https://cdn-icons-png.flaticon.com/512/3202/3202926.png" alt="Carro animado" class="carro-animado">
            </div>
        </div>
    </header>

    <div class="container mb-5">
        
        <!-- Tarjetas de Resumen (Disponibilidad) -->
        <div class="row text-center mb-4">
            <div class="col-md-6">
                <div class="card tarjeta-premium p-3 bg-white border-primary border-top border-4">
                    <h5 class="text-muted">Celdas Carros Disponibles</h5>
                    <h2 class="text-primary fw-bold" id="disponibles-carro">--</h2>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card tarjeta-premium p-3 bg-white border-info border-top border-4">
                    <h5 class="text-muted">Celdas Motos Disponibles</h5>
                    <h2 class="text-info fw-bold" id="disponibles-moto">--</h2>
                </div>
            </div>
        </div>

        <!-- Formulario de Ingreso (Ahora en la parte superior) -->
        <div class="card tarjeta-premium mb-4">
            <div class="card-header bg-dark text-white fw-bold" style="border-top-left-radius: 15px; border-top-right-radius: 15px;">
                🚘 Registrar Nuevo Ingreso
            </div>
            <div class="card-body bg-white">
                <form id="form-ingreso">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label text-muted">Placa</label>
                            <input type="text" class="form-control bg-light" id="placa" required placeholder="Ej: ABC123">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted">Marca</label>
                            <input type="text" class="form-control bg-light" id="marca" required placeholder="Ej: Mazda">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted">Color</label>
                            <input type="text" class="form-control bg-light" id="color" required placeholder="Ej: Rojo">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted">Tipo de Vehículo</label>
                            <select class="form-select bg-light" id="tipo" required>
                                <option value="CARRO">Carro</option>
                                <option value="MOTO">Moto</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted">Cédula del Propietario</label>
                            <input type="text" class="form-control bg-light" id="cedula" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted">Nombre del Propietario</label>
                            <input type="text" class="form-control bg-light" id="nombrePropietario" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label small">Operario de Turno</label>
                            <select class="form-select" id="operario" required>
                                <option value="" selected disabled>Seleccionar operario...</option>
                                <option value="1">Operario 1 · Puerta 1</option>
                                <option value="2">Operario 2 · Puerta 2</option>
                            </select>
                        </div>
                        <div class="col-12 text-end mt-4">
                            <button type="submit" class="btn btn-primary btn-lg px-5">Guardar Ingreso</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de Celdas (Oculta en un Acordeón Desplegable) -->
        <div class="accordion tarjeta-premium shadow-sm" id="acordeonCeldas">
            <div class="accordion-item" style="border-radius: 15px; overflow: hidden;">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed bg-dark text-white fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#panelCeldas">
                        📋 Ver Estado Actual de Todas las Celdas
                    </button>
                </h2>
                <!-- El panel arranca cerrado (collapse) -->
                <div id="panelCeldas" class="accordion-collapse collapse" data-bs-parent="#acordeonCeldas">
                    <div class="accordion-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Celda #</th>
                                        <th>Tipo</th>
                                        <th>Estado</th>
                                        <th>Placa</th>
                                        <th>Propietario</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-celdas">
                                    <!-- Aquí se insertan los datos desde JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Ventana de resultado: sirve para ingreso exitoso, salida exitosa y errores -->
    <div class="modal fade" id="modalResultado" tabindex="-1" aria-labelledby="resultadoTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 18px;">
                <div class="modal-body p-4 p-md-5 text-center">
                    <div id="resultadoIcono" class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle fs-1 fw-bold" style="width: 72px; height: 72px;" aria-hidden="true"></div>
                    <h4 class="fw-bold mb-1" id="resultadoTitulo"></h4>
                    <p class="text-muted mb-0" id="resultadoMensaje"></p>

                    <div id="resultadoCelda" class="bg-dark text-white rounded-4 py-3 mx-auto mt-4 d-none" style="max-width: 260px;">
                        <div class="small" id="resultadoCeldaEtiqueta">Celda asignada</div>
                        <div class="display-5 fw-bold" id="resultadoCeldaCodigo"></div>
                    </div>

                    <dl id="resultadoDatos" class="text-start mt-4 mb-0 d-none"></dl>

                    <button type="button" class="btn btn-primary px-5 mt-4" data-bs-dismiss="modal">Entendido</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Ventana para confirmar una salida -->
    <div class="modal fade" id="modalConfirmarSalida" tabindex="-1" aria-labelledby="confirmarSalidaTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 18px;">
                <div class="modal-body p-4 p-md-5 text-center">
                    <h4 class="fw-bold mb-2" id="confirmarSalidaTitulo">¿Registrar la salida?</h4>
                    <p class="text-muted" id="confirmarSalidaTexto"></p>
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger px-4" id="btnConfirmarSalida">Confirmar salida</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap y nuestra App -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
